<!DOCTYPE html>
<html lang="es" class="h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Héroes Mexicanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <link href="css/estilo.css" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

    <!-- Begin page content -->
    <main class="flex-shrink-0">
        <div class="container">
            <h3 class="my-3" id="titulo">Gestión de Héroes Mexicanos</h3>

            <a href="nuevo" class="btn btn-success">Agregar</a>
            <div class="row g-2 my-3">
                <div class="col-md-3">
                    <select id="filtro-tipo" class="form-select">
                        <option value="epoca">Época</option>
                        <option value="movimiento">Movimiento</option>
                        <option value="estado">Estado</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <input type="text" id="filtro-valor" class="form-control" placeholder="Buscar...">
                </div>
                <div class="col-md-4">
                    <button type="button" id="btn-filtrar" class="btn btn-primary">Buscar</button>
                    <button type="button" id="btn-limpiar" class="btn btn-secondary">Limpiar</button>
                </div>
            </div>
            <table class="table table-hover table-bordered my-3" aria-describedby="titulo">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellido</th>
                        <th scope="col">Fecha de Nacimiento</th>
                        <th scope="col">Estado de Nacimiento</th>
                        <th scope="col">Epoca</th>
                        <th scope="col">Movimiento</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>

                <tbody id="tabla-heroes">
                <tr th:each="heroes : ${heroes}">
                    <td th:text="${heroes.nombre}">ID </td>
                    <td th:text="${heroes.apellido}">ID </td>
                    <td th:text="${heroes.fechaNacimiento}">ID </td>
                    <td th:text="${heroes.estadoNacimiento}">ID </td>
                    <td th:text="${heroes.epoca}">ID </td>
                    <td th:text="${heroes.movimiento}">ID </td>
                    <td th:text="${heroes.descripcion}">ID </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-body-tertiary">
        <div class="container">
            <span class="text-body-secondary"> 2024 | Códigos de Programación</span>
        </div>
    </footer>

    <div class="modal fade" id="eliminaModal" tabindex="-1" aria-labelledby="eliminaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="eliminaModalLabel">Aviso</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>¿Desea eliminar este registro?</p>
                </div>
                <div class="modal-footer">
                    <form id="form-elimina" action="" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>

        const eliminaModal = document.getElementById('eliminaModal')
        if (eliminaModal) {
            eliminaModal.addEventListener('show.bs.modal', event => {
                // Button that triggered the modal
                const button = event.relatedTarget
                // Extract info from data-bs-* attributes
                const id = button.getAttribute('data-bs-id')

                // Update the modal's content.
                const form = eliminaModal.querySelector('#form-elimina')
                form.setAttribute('action', 'elimina.html?id=' + id)
            })
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/heroes.js"></script>

</body>

</html>
