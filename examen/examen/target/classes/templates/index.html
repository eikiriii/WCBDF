<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-3">
            <h3 class="m-0">Usuarios</h3>
            <a href="/nuevo" class="btn btn-primary">Nuevo usuario</a>
        </div>

        <div class="mb-3">
            <input type="search" id="buscador" class="form-control" autocomplete="off"
                   placeholder="Buscar por nombre, apellidos o usuario (mínimo 3 caracteres)">
            <div id="mensaje" class="form-text"></div>
        </div>

        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Nombre completo</th>
                <th>Usuario</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="tabla-usuarios"></tbody>
        </table>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const API = '/api/v1/usuarios';
    let temporizador = null;

    function textoActual() {
        const t = $('#buscador').val().trim();
        return t.length >= 3 ? t : '';
    }

    function pintar(usuarios) {
        const $tbody = $('#tabla-usuarios').empty();

        if (usuarios.length === 0) {
            $tbody.append(
                $('<tr>').append($('<td colspan="6" class="text-center text-muted">').text('Sin resultados'))
            );
            return;
        }

        usuarios.forEach(u => {
            const $acciones = $('<td class="text-end">')
                .append($('<a class="btn btn-sm btn-warning me-1">').attr('href', '/edita?id=' + u.id).text('Editar'))
                .append($('<button class="btn btn-sm btn-danger">').text('Eliminar')
                    .on('click', () => eliminar(u.id)));

            $tbody.append(
                $('<tr>')
                    .append($('<td>').text(`${u.nombre} ${u.apellido_paterno} ${u.apellido_materno}`))
                    .append($('<td>').text(u.usuario))
                    .append($acciones)
            );
        });
    }

    function cargar(texto) {
        const url = texto ? `${API}/buscar?texto=${encodeURIComponent(texto)}` : API;
        $.getJSON(url)
            .done(pintar)
            .fail(() => $('#mensaje').text('Error al consultar los usuarios.'));
    }

    function eliminar(id) {
        if (!confirm('¿Eliminar este usuario?')) return;
        $.ajax({ url: `${API}/${id}`, type: 'DELETE' })
            .done(() => cargar(textoActual()))
            .fail(() => $('#mensaje').text('No se pudo eliminar el usuario.'));
    }

    $('#buscador').on('input', function () {
        clearTimeout(temporizador);
        const texto = this.value.trim();

        if (texto.length === 0) {
            $('#mensaje').text('');
            cargar('');
            return;
        }
        if (texto.length < 3) {
            $('#mensaje').text('Escribe al menos 3 caracteres para buscar.');
            return;
        }

        $('#mensaje').text('');
        temporizador = setTimeout(() => cargar(texto), 300);
    });

    cargar('');
</script>
</body>
</html>
